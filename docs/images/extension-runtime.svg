<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" font-family="ui-sans-serif, system-ui, sans-serif">
  <defs>
    <marker id="rpc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7750a8"/></marker>
    <marker id="win" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0b7f88"/></marker>
    <marker id="act" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b75a28"/></marker>
    <style>
      .group { fill: #fff; stroke: #d9dfeb; stroke-width: 1.5; }
      .glabel { font-size: 11px; font-weight: 700; fill: #566273; letter-spacing: 0.04em; }
      .box { stroke-width: 2; }
      .main { fill: #e8f4ec; stroke: #27734a; }
      .isolated { fill: #fff4df; stroke: #996515; }
      .ext { fill: #eaf0ff; stroke: #3759a6; }
      .worker { fill: #f1eafe; stroke: #6f45a8; }
      .external { fill: #eef1f5; stroke: #566273; }
      .title { font-size: 15px; font-weight: 700; fill: #172033; }
      .sub { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11.5px; fill: #657086; }
      .label { font-size: 11px; fill: #566273; }
      .rpc { stroke: #7750a8; stroke-width: 2.5; stroke-dasharray: 7 5; fill: none; marker-end: url(#rpc); }
      .win { stroke: #0b7f88; stroke-width: 2.5; fill: none; marker-end: url(#win); }
      .act { stroke: #b75a28; stroke-width: 2.5; fill: none; marker-end: url(#act); }
    </style>
  </defs>
  <rect width="1000" height="560" fill="#fff"/>

  <!-- YouTube watch tab -->
  <rect class="group" x="20" y="20" width="560" height="290" rx="12"/>
  <text x="36" y="42" class="glabel">YOUTUBE WATCH TAB · youtube.com</text>
  <rect class="box main" x="40" y="60" width="230" height="86" rx="8"/>
  <text x="56" y="86" class="title">content.tsx</text>
  <text x="56" y="108" class="sub">MAIN world</text>
  <text x="56" y="128" class="sub">panel + player sync</text>
  <rect class="box isolated" x="330" y="60" width="230" height="86" rx="8"/>
  <text x="346" y="86" class="title">rpc-relay.js</text>
  <text x="346" y="108" class="sub">ISOLATED world</text>
  <text x="346" y="128" class="sub">chrome.runtime bridge</text>
  <rect class="box external" x="40" y="200" width="230" height="86" rx="8"/>
  <text x="56" y="226" class="title">video element</text>
  <text x="56" y="248" class="sub">YouTube player</text>
  <text x="56" y="268" class="sub">playback clock</text>
  <rect class="box ext" x="330" y="200" width="230" height="86" rx="8"/>
  <text x="346" y="226" class="title">extension-storage.html</text>
  <text x="346" y="248" class="sub">hidden extension frame</text>
  <text x="346" y="268" class="sub">replacement audio</text>
  <path class="rpc" d="M270 103 H326"/>
  <path class="win" d="M155 146 V196"/>
  <text x="163" y="176" class="label">sync</text>
  <path class="win" d="M270 128 C300 128 300 243 326 243"/>
  <text x="310" y="172" class="label">load /</text>
  <text x="310" y="186" class="label">store</text>

  <!-- Service worker -->
  <rect class="box worker" x="640" y="60" width="340" height="86" rx="8"/>
  <text x="656" y="86" class="title">background.ts</text>
  <text x="656" y="108" class="sub">MV3 service worker</text>
  <text x="656" y="128" class="sub">open tab · storage frame URL</text>
  <path class="rpc" d="M560 103 H636"/>
  <path class="act" d="M720 146 C720 320 640 350 586 368"/>
  <text x="664" y="290" class="label">opens tab</text>

  <!-- Legend -->
  <rect class="box main" x="800" y="186" width="16" height="12" rx="2" stroke-width="1.5"/>
  <text x="824" y="196" class="label">YouTube origin, MAIN world</text>
  <rect class="box isolated" x="800" y="206" width="16" height="12" rx="2" stroke-width="1.5"/>
  <text x="824" y="216" class="label">YouTube origin, ISOLATED</text>
  <rect class="box ext" x="800" y="226" width="16" height="12" rx="2" stroke-width="1.5"/>
  <text x="824" y="236" class="label">Extension origin</text>
  <rect class="box worker" x="800" y="246" width="16" height="12" rx="2" stroke-width="1.5"/>
  <text x="824" y="256" class="label">Service worker</text>
  <line x1="796" y1="276" x2="820" y2="276" stroke="#7750a8" stroke-width="2.5" stroke-dasharray="5 3"/>
  <text x="824" y="280" class="label">Runtime relay RPC</text>
  <line x1="796" y1="296" x2="820" y2="296" stroke="#0b7f88" stroke-width="2.5"/>
  <text x="824" y="300" class="label">Window RPC</text>
  <line x1="796" y1="316" x2="820" y2="316" stroke="#b75a28" stroke-width="2.5"/>
  <text x="824" y="320" class="label">Tab or network action</text>

  <!-- Extension tab -->
  <rect class="group" x="20" y="350" width="560" height="190" rx="12"/>
  <text x="36" y="372" class="glabel">EXTENSION TAB · chrome-extension://&lt;id&gt;</text>
  <rect class="box ext" x="40" y="400" width="230" height="100" rx="8"/>
  <text x="56" y="428" class="title">index.html</text>
  <text x="56" y="450" class="sub">extension page</text>
  <text x="56" y="470" class="sub">stem generator</text>
  <text x="56" y="488" class="sub">saved audio</text>
  <rect class="box main" x="330" y="400" width="230" height="100" rx="8"/>
  <text x="346" y="428" class="title">embed-content.ts</text>
  <text x="346" y="450" class="sub">hidden youtube.com/embed/</text>
  <text x="346" y="470" class="sub">MAIN world</text>
  <text x="346" y="488" class="sub">resolve + download</text>
  <path class="win" d="M270 450 H326"/>

  <!-- Googlevideo -->
  <rect class="box external" x="640" y="415" width="340" height="70" rx="8"/>
  <text x="656" y="442" class="title">Googlevideo CDN</text>
  <text x="656" y="464" class="sub">audio-only format bytes</text>
  <path class="act" d="M560 450 H636"/>
  <text x="566" y="472" class="label">64 KiB</text>
  <text x="566" y="486" class="label">ranges</text>
</svg>

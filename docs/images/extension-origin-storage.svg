<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" font-family="ui-sans-serif, system-ui, sans-serif">
  <defs>
    <marker id="rpc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7750a8"/></marker>
    <marker id="win" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0b7f88"/></marker>
    <marker id="act" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b75a28"/></marker>
    <style>
      .group { fill: #fff; stroke: #d9dfeb; stroke-width: 1.5; }
      .glabel { font-size: 11px; font-weight: 700; fill: #566273; letter-spacing: 0.04em; }
      .box { stroke-width: 2; }
      .main { fill: #e8f4ec; stroke: #27734a; }
      .isolated { fill: #fff4df; stroke: #996515; }
      .ext { fill: #eaf0ff; stroke: #3759a6; }
      .worker { fill: #f1eafe; stroke: #6f45a8; }
      .store { fill: #e8f7f7; stroke: #08747d; }
      .title { font-size: 15px; font-weight: 700; fill: #172033; }
      .sub { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11.5px; fill: #657086; }
      .label { font-size: 11px; fill: #566273; }
      .rpc { stroke: #7750a8; stroke-width: 2.5; stroke-dasharray: 7 5; fill: none; marker-end: url(#rpc); }
      .win { stroke: #0b7f88; stroke-width: 2.5; fill: none; marker-end: url(#win); }
      .act { stroke: #b75a28; stroke-width: 2.5; fill: none; marker-end: url(#act); }
    </style>
  </defs>
  <rect width="1000" height="540" fill="#fff"/>

  <!-- YouTube watch tab -->
  <rect class="group" x="20" y="20" width="600" height="370" rx="12"/>
  <text x="36" y="42" class="glabel">YOUTUBE WATCH TAB · youtube.com</text>
  <rect class="box main" x="40" y="60" width="250" height="90" rx="8"/>
  <text x="56" y="86" class="title">content.tsx</text>
  <text x="56" y="108" class="sub">MAIN world</text>
  <text x="56" y="128" class="sub">replacement audio panel</text>
  <rect class="box isolated" x="350" y="60" width="250" height="90" rx="8"/>
  <text x="366" y="86" class="title">rpc-relay.js</text>
  <text x="366" y="108" class="sub">ISOLATED world</text>
  <text x="366" y="128" class="sub">forwards to service worker</text>
  <path class="rpc" d="M290 95 H346"/>
  <text x="296" y="84" class="label">1. URL</text>

  <rect class="box ext" x="40" y="250" width="560" height="110" rx="8" stroke-dasharray="6 4"/>
  <text x="56" y="276" class="title">extension-storage.html</text>
  <text x="56" y="298" class="sub">hidden frame · chrome-extension://&lt;id&gt;</text>
  <text x="56" y="318" class="sub">handlers: loadAudio, storeAudio</text>
  <text x="56" y="338" class="sub">replies only to https://www.youtube.com</text>
  <path class="act" d="M110 150 V246"/>
  <text x="118" y="204" class="label">2. mount iframe</text>
  <path class="win" d="M240 150 V246"/>
  <text x="248" y="196" class="label">3. window RPC</text>
  <text x="248" y="212" class="label">StoredAudio with track blobs</text>

  <!-- Service worker -->
  <rect class="box worker" x="680" y="60" width="300" height="90" rx="8"/>
  <text x="696" y="86" class="title">background.ts</text>
  <text x="696" y="108" class="sub">MV3 service worker</text>
  <text x="696" y="128" class="sub">chrome.runtime.getURL(...)</text>
  <path class="rpc" d="M600 95 H676"/>

  <!-- IndexedDB -->
  <rect class="box store" x="680" y="250" width="300" height="110" rx="8"/>
  <text x="696" y="276" class="title">IndexedDB</text>
  <text x="696" y="298" class="sub">origin chrome-extension://&lt;id&gt;</text>
  <text x="696" y="318" class="sub">db youtube-audio-replacement</text>
  <text x="696" y="338" class="sub">store audio · key videoId</text>
  <path class="win" d="M600 305 H676"/>
  <text x="606" y="296" class="label">4. get / put</text>

  <!-- Extension tab -->
  <rect class="group" x="660" y="410" width="340" height="120" rx="12" fill="none"/>
  <text x="676" y="430" class="glabel">EXTENSION TAB</text>
  <rect class="box ext" x="680" y="440" width="300" height="76" rx="8"/>
  <text x="696" y="466" class="title">index.html</text>
  <text x="696" y="488" class="sub">saved audio: list, delete</text>
  <text x="696" y="506" class="sub">same origin, no bridge</text>
  <path class="win" d="M830 440 V364"/>

  <!-- Legend -->
  <rect class="box main" x="40" y="420" width="16" height="12" rx="2" stroke-width="1.5"/>
  <text x="64" y="430" class="label">YouTube origin, MAIN world</text>
  <rect class="box isolated" x="40" y="440" width="16" height="12" rx="2" stroke-width="1.5"/>
  <text x="64" y="450" class="label">YouTube origin, ISOLATED world</text>
  <rect class="box ext" x="40" y="460" width="16" height="12" rx="2" stroke-width="1.5"/>
  <text x="64" y="470" class="label">Extension origin</text>
  <rect class="box store" x="40" y="480" width="16" height="12" rx="2" stroke-width="1.5"/>
  <text x="64" y="490" class="label">Extension-origin IndexedDB</text>
  <line x1="300" y1="426" x2="324" y2="426" stroke="#7750a8" stroke-width="2.5" stroke-dasharray="5 3"/>
  <text x="332" y="430" class="label">Runtime relay RPC</text>
  <line x1="300" y1="446" x2="324" y2="446" stroke="#b75a28" stroke-width="2.5"/>
  <text x="332" y="450" class="label">Frame mount</text>
  <line x1="300" y1="466" x2="324" y2="466" stroke="#0b7f88" stroke-width="2.5"/>
  <text x="332" y="470" class="label">Window RPC or storage access</text>
</svg>
